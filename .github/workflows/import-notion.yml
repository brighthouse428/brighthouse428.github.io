name: Import images from original Notion portfolio
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-notion.yml"
      - "scripts/import-notion-images.mjs"
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright sharp
      - run: npx playwright install chromium --with-deps
      - run: node scripts/import-notion-images.mjs
      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/notion/
          if ! git diff --cached --quiet; then
            git commit -m "Import original portfolio images from Notion"
            git pull --rebase origin main
            git push origin main
          fi
